<svg xmlns="http://www.w3.org/2000/svg" width="800" height="187" viewBox="0 0 800 187" role="img"><rect x="0" y="0" width="3" height="187" rx="1.5" fill="#4C1D95" stroke="none"/><text x="20" y="22" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#24292F" xml:space="preserve">Graduado em <tspan fill="#6D28D9" font-weight="600">Análise </tspan><tspan fill="#6D28D9" font-weight="600">e </tspan><tspan fill="#6D28D9" font-weight="600">Desenvolvimento </tspan><tspan fill="#6D28D9" font-weight="600">de </tspan><tspan fill="#6D28D9" font-weight="600">Sistemas</tspan>, com interesse em </text><text x="20" y="46" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#24292F" xml:space="preserve">desenvolvimento de software, bancos de dados e soluções tecnológicas.</text><text x="20" y="81" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#24292F" xml:space="preserve">Possuo experiência acadêmica e prática no desenvolvimento de aplicações, construção de </text><text x="20" y="105" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#24292F" xml:space="preserve"><tspan fill="#6D28D9" font-weight="600">APIs </tspan><tspan fill="#6D28D9" font-weight="600">REST</tspan>, integração entre sistemas e implementação de regras de negócio.</text><text x="20" y="140" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#24292F" xml:space="preserve">Busco transformar conhecimentos técnicos em soluções funcionais, valorizando a </text><text x="20" y="164" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#24292F" xml:space="preserve">organização, a <tspan fill="#6D28D9" font-weight="600">qualidade </tspan><tspan fill="#6D28D9" font-weight="600">do </tspan><tspan fill="#6D28D9" font-weight="600">código</tspan> e o aprendizado contínuo.</text></svg>